name: Motor CUSUM V8 reproduction
on:
  push:
    branches: [research/motor-cusum-v8-20261105]
    paths:
      - 'research/motor_cusum_v8/**'
      - '.github/workflows/motor-cusum-v8.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motor-cusum-v8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/motor_cusum_v8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements.txt
      - name: Causal unique-packet and first-diagnosis integrity
        run: python -m unittest -v
      - name: Reproduce all locked outcomes including failed screen
        run: python replay.py --out results/ci --workers 2
      - name: Independent packet, record and interval verification
        run: python verify.py results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-cusum-v8-raw-results
          path: research/motor_cusum_v8/results/ci
