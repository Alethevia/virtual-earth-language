name: Motor calibration V6 reproduction
on:
  push:
    branches: [research/motor-calibration-v6-20261104]
    paths:
      - 'research/motor_calibration_v6/**'
      - '.github/workflows/motor-calibration-v6.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motor-calibration-v6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/motor_calibration_v6
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements.txt
      - name: Causal counts and strict first-diagnosis tests
        run: python -m unittest -v
      - name: Reproduce all locked conditions including adverse correlation
        run: python replay.py --out results/ci --workers 2
      - name: Independently reconstruct packets, records and all intervals
        run: python verify.py results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-calibration-v6-raw-results
          path: research/motor_calibration_v6/results/ci
