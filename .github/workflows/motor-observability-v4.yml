name: Motor observability V4 reproduction
on:
  push:
    branches: [research/motor-observability-v4-20261104]
    paths:
      - 'research/motor_observability_v4/**'
      - '.github/workflows/motor-observability-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motor-observability-v4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/motor_observability_v4
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements.txt
      - name: Causality and attribution counterexamples
        run: python -m unittest -v
      - name: Locked full replay with all failure cases
        run: python run_all.py --out results/ci
      - name: Independently reconstruct records and RMS windows
        run: python verify.py results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-observability-v4-raw-results
          path: research/motor_observability_v4/results/ci
