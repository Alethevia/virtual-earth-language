name: Motor triage V3 reproduction
on:
  push:
    branches: [research/motor-triage-v3-20261104]
    paths:
      - 'research/motor_consistency_v3/**'
      - '.github/workflows/motor-triage-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motor-triage-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/motor_consistency_v3
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements.txt
      - name: Causality, solver and identifiability integrity tests
        run: python -m unittest -v
      - name: Full locked replay including negative controls
        run: python run_all.py --out results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-triage-v3-raw-results
          path: research/motor_consistency_v3/results/ci
